# GitHub Actions workflow for automating the release process of Emo.
#
# prepare-release:
# 1. Generates a changelog from commits since the previous tag (feat: and fix: only).
# 2. Updates the version in `src-tauri/tauri.conf.json` and `src-tauri/Cargo.toml`, then creates a commit.
# 3. Creates a tag with the version number (e.g., `v1.2.3`) and pushes it.
#
# tauri-publish:
# - Builds and publishes a release for each platform.
#   Artifacts: Windows portable exe, Windows NSIS installer, Arm Mac DMG, Linux x64/arm AppImage.
# - The release is created as a draft for review before publishing.
# - See: https://tauri.app/distribute/pipelines/github/

name: "release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 1.2.3 — without the "v" prefix)'
        required: true

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get previous tag
        id: prev-tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        env:
          PREV_TAG: ${{ steps.prev-tag.outputs.tag }}
        run: |
          if [ -z "$PREV_TAG" ]; then
            COMMITS=""
          else
            COMMITS=$(git log --pretty=format:"%s" "${PREV_TAG}..HEAD")
          fi

          FEAT_LIST=""
          FIX_LIST=""

          # Only 'feat:' and 'fix:' are included; all other types are ignored.
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            if echo "$line" | grep -qE '^feat(\([^)]*\))?[!]?:'; then
              msg=$(echo "$line" | sed -E 's/^feat(\([^)]*\))?[!]?: ?//')
              FEAT_LIST="${FEAT_LIST}- ${msg}"$'\n'
            elif echo "$line" | grep -qE '^fix(\([^)]*\))?[!]?:'; then
              msg=$(echo "$line" | sed -E 's/^fix(\([^)]*\))?[!]?: ?//')
              FIX_LIST="${FIX_LIST}- ${msg}"$'\n'
            fi
          done <<< "$COMMITS"

          CHANGELOG=""
          if [ -n "$FEAT_LIST" ]; then
            CHANGELOG="${CHANGELOG}## Features"$'\n'"${FEAT_LIST}"$'\n'
          fi
          if [ -n "$FIX_LIST" ]; then
            CHANGELOG="${CHANGELOG}## Bug Fixes"$'\n'"${FIX_LIST}"$'\n'
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No notable changes."$'\n'
          fi
          CHANGELOG="${CHANGELOG}"$'\n'"---"$'\n\n'"See the assets to download this version and install."

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Update version in tauri.conf.json
        run: |
          sed -i 's/"version": "[0-9]*\.[0-9]*\.[0-9]*"/"version": "${{ github.event.inputs.version }}"/' src-tauri/tauri.conf.json

      - name: Update version in Cargo.toml
        run: |
          sed -i 's/^version = "[0-9]*\.[0-9]*\.[0-9]*"/version = "${{ github.event.inputs.version }}"/' src-tauri/Cargo.toml

      - name: Update version in Cargo.lock
        run: |
          sed -i '/^name = "app"$/{n; s/^version = "[0-9]*\.[0-9]*\.[0-9]*"/version = "${{ github.event.inputs.version }}"/}' src-tauri/Cargo.lock

      - name: Commit and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore: bump version to v${{ github.event.inputs.version }}"
          git tag "v${{ github.event.inputs.version }}"
          git push
          git push --tags

  publish-tauri:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin --bundles dmg"
          - platform: "ubuntu-24.04"
            args: "--bundles appimage"
          - platform: "ubuntu-24.04-arm" # Only available in public repos.
            args: "--bundles appimage"
          - platform: "windows-latest"
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ github.event.inputs.version }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04' || matrix.platform == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v5
        with:
          version: latest

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: pnpm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ github.event.inputs.version }}
          releaseName: v${{ github.event.inputs.version }}
          releaseBody: ${{ needs.prepare-release.outputs.changelog }}
          releaseDraft: true
          prerelease: false
          # TODO: "releaseAssetNamePattern" requires "tauri-action@v1" which is not yet released.
          # releaseAssetNamePattern: '[name]_[version]_[platform]_[arch][_setup][ext]'
          args: ${{ matrix.args }}

      - name: Upload Windows portable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          Copy-Item "src-tauri/target/release/app.exe" "emo_${version}_windows_x64_portable.exe"
          gh release upload "v${version}" "emo_${version}_windows_x64_portable.exe" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
